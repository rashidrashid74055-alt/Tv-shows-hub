<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVAFLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--r:#e50914;--bg:#0b0b0f;--c:#16161d;--t:#fff;--m:#9a9aa6}
body{background:var(--bg);color:var(--t);font-family:'Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:14px 22px;background:linear-gradient(180deg,#0b0b0f 20%,rgba(11,11,15,.85) 70%,transparent);backdrop-filter:blur(8px)}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px;color:var(--r);cursor:pointer;white-space:nowrap}
.logo span{color:#fff}
nav{display:flex;gap:16px;font-size:14px;color:var(--m)}
nav a{cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:#fff;border-color:var(--r)}
.srch{margin-left:auto;display:flex;align-items:center;background:#1c1c26;border:1px solid #2c2c3a;border-radius:8px;padding:7px 12px;gap:8px;width:260px}
.srch input{background:none;border:0;outline:0;color:#fff;width:100%;font-size:14px}
@media(max-width:760px){nav{display:none}.srch{width:150px}}
main{padding-bottom:60px}
#hero{position:relative;height:62vh;min-height:380px;display:flex;align-items:flex-end;background-size:cover;background-position:center 20%;padding:30px 22px 40px}
#hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.15),rgba(11,11,15,.6) 55%,var(--bg))}
.hero-in{position:relative;z-index:2;max-width:640px}
.hero-in h1{font-size:clamp(26px,5vw,52px);line-height:1.05;margin-bottom:12px}
.hero-in p{color:#d3d3dd;font-size:14px;line-height:1.5;max-height:66px;overflow:hidden;margin-bottom:16px}
.meta{display:flex;gap:12px;font-size:13px;color:#cfcfda;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.rate{color:#46d369;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;background:#e6e6e6;color:#000}
.btn:hover{background:#fff}
.btn.ghost{background:rgba(90,90,110,.55);color:#fff}
.btn.ghost:hover{background:rgba(120,120,150,.7)}
.btn.red{background:var(--r);color:#fff}
.row{margin:26px 0 6px;padding:0 22px}
.row h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.row h2 b{font-size:12px;color:var(--m);font-weight:500;cursor:pointer}
.row h2 b:hover{color:#fff}
.track{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 148px;cursor:pointer;position:relative}
.card img{width:148px;height:222px;object-fit:cover;border-radius:7px;background:#1e1e28;display:block}
.card:hover img{outline:2px solid var(--r)}
.card .cn{font-size:12px;color:#c8c8d4;margin-top:6px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:16px 22px}
.grid .card{flex:none;width:auto}
.grid .card img{width:100%;height:auto;aspect-ratio:2/3}
#sentinel{height:40px}
#detail{padding-bottom:60px}
.dback{position:relative;height:52vh;min-height:320px;background-size:cover;background-position:center 18%}
.dback::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.2),rgba(11,11,15,.75) 60%,var(--bg))}
.dwrap{max-width:900px;margin:-140px auto 0;position:relative;z-index:3;padding:0 22px}
.dwrap h1{font-size:clamp(24px,4vw,42px);margin-bottom:12px}
.dwrap .desc{color:#c9c9d6;font-size:14px;line-height:1.6;margin:14px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:8px 15px;border-radius:20px;background:#20202b;border:1px solid #31313f;font-size:13px;cursor:pointer;color:#d7d7e2}
.chip:hover{border-color:#555}
.chip.on{background:var(--r);border-color:var(--r);color:#fff;font-weight:700}
.lbl{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin-top:18px}
select{background:#20202b;color:#fff;border:1px solid #31313f;border-radius:6px;padding:8px 10px;font-size:13px;outline:0}
.stabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0 14px;padding-bottom:6px;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.ep{display:flex;gap:12px;padding:12px;border-radius:8px;cursor:pointer;border-bottom:1px solid #1d1d27}
.ep:hover{background:#16161f}
.ep img{width:130px;height:74px;object-fit:cover;border-radius:5px;background:#22222e;flex:0 0 auto}
.ep .en{font-size:14px;font-weight:600;margin-bottom:5px}
.ep .eo{font-size:12px;color:var(--m);line-height:1.45;max-height:54px;overflow:hidden}
#player{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:9px;padding:9px 14px;background:#0d0d12;border-bottom:1px solid #1e1e28;flex-wrap:wrap}
.pbar .pt{font-size:13px;font-weight:700;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}
.pb{background:#1d1d27;border:1px solid #2e2e3c;color:#e8e8f0;border-radius:6px;padding:7px 11px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pb:hover{background:#2a2a38}
.pb.act{background:var(--r);border-color:var(--r);color:#fff;font-weight:700}
.pb.hi{font-size:13px;font-weight:800}
.fwrap{flex:1;position:relative;background:#000}
.fwrap iframe{width:100%;height:100%;border:0;display:block}
.menu{position:absolute;top:100%;right:0;margin-top:6px;background:#15151d;border:1px solid #2c2c3a;border-radius:8px;padding:6px;min-width:150px;max-height:300px;overflow:auto;z-index:20;box-shadow:0 10px 30px #000a}
.menu div{padding:9px 12px;border-radius:5px;font-size:13px;cursor:pointer;white-space:nowrap}
.menu div:hover{background:#262633}
.menu div.on{color:var(--r);font-weight:700}
.rel{position:relative}
.tip{padding:8px 14px;background:#15151d;border-top:1px solid #1e1e28;font-size:12px;color:#a9a9b8;line-height:1.5}
.tip b{color:#fff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#e50914;color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:500;transition:.3s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.load{padding:40px;text-align:center;color:var(--m)}
.back{position:fixed;top:14px;left:14px;z-index:80;width:40px;height:40px;border-radius:50%;background:#000b;border:0;color:#fff;font-size:19px;cursor:pointer}
.back:hover{background:#000}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">NOVA<span>FLIX</span></div>
  <nav>
    <a onclick="goHome()">होम</a>
    <a onclick="browse('movie')">फ़िल्में</a>
    <a onclick="browse('series')">वेब सीरीज़</a>
    <a onclick="showList()">मेरी लिस्ट</a>
  </nav>
  <div class="srch">
    <span>🔍</span>
    <input id="q" placeholder="फ़िल्म, सीरीज़ खोजें..." autocomplete="off">
  </div>
</header>

<main id="app">
  <section id="hero"></section>
  <div id="rows"></div>
  <div id="sentinel"></div>
</main>

<div id="detail" class="hidden"></div>

<div id="player" class="hidden">
  <div class="pbar">
    <button class="pb" onclick="closePlayer()">✕</button>
    <div class="pt" id="pTitle"></div>
    <div class="rel">
      <button class="pb hi act" id="pAudioBtn" onclick="toggleMenu('mAudio')">🔊 <span id="pAudioTxt">हिंदी</span> ▾</button>
      <div class="menu hidden" id="mAudio"></div>
    </div>
    <div class="rel">
      <button class="pb" id="pQualBtn" onclick="toggleMenu('mQual')">⚙️ <span id="pQualTxt">Auto</span> ▾</button>
      <div class="menu hidden" id="mQual"></div>
    </div>
    <div class="rel">
      <button class="pb" onclick="toggleMenu('mSub')">💬 <span id="pSubTxt">सबटाइटल</span> ▾</button>
      <div class="menu hidden" id="mSub"></div>
    </div>
    <button class="pb" id="pSrvBtn" onclick="nextServer()">⏭ अगला सर्वर</button>
    <button class="pb" onclick="openTab()">↗ नई टैब</button>
  </div>
  <div class="fwrap"><iframe id="frame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="origin"></iframe></div>
  <div class="tip">अगर audio अभी भी English है → player के अंदर <b>🔊 audio icon</b> दबाकर हिंदी चुनें, या <b>नई टैब</b> में खोलें। सर्वर: <b id="pSrvName">—</b></div>
</div>

<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const API='https://v3-cinemeta.strem.io';
const AUDIO=[['original','Original'],['hi','हिंदी'],['en','English'],['ta','तमिल'],['te','तेलुगु'],['ml','मलयालम'],['kn','कन्नड़'],['bn','बांग्ला'],['mr','मराठी'],['pa','पंजाबी'],['gu','गुजराती'],['ur','उर्दू']];
const QUAL=[['','Auto'],['2160','4K'],['1080','1080p'],['720','720p'],['480','480p']];

const state={type:'movie',audio:localStorage.getItem('nfx_audio')||'hi',q:'',sub:'',srv:0,tries:0,
  imdb:null,tmdb:null,title:null,season:1,ep:1,open:false,gen:null,skip:0,search:''};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
function lbl(code){const f=AUDIO.find(a=>a[0]===code);return f?f[1]:'Original'}
function qlbl(code){const f=QUAL.find(a=>a[0]===code);return f?f[1]:'Auto'}
async function J(u){const r=await fetch(u);if(!r.ok)throw new Error('x');return r.json()}

/* ---------- servers ---------- */
const SERVERS=[
 {n:'Videasy',lang:1,q:1,tmdb:1,u:(id,t,s,e,q,l)=>'https://player.videasy.net/'+t+'/'+id+(t==='tv'?'/'+s+'/'+e:'')+'?color=e50914'+(l?'&lang='+l+'':'')+(q?'&quality='+q:'')},
 {n:'VidFast',lang:1,q:1,tmdb:1,u:(id,t,s,e,q,l)=>'https://vidfast.pro/'+t+'/'+id+(t==='tv'?'/'+s+'/'+e:'')+'?'+(l?'lang='+l+'&':'')+(q?'quality='+q:'')},
 {n:'VidLink',lang:1,q:1,tmdb:1,u:(id,t,s,e,q,l)=>'https://vidlink.pro/'+t+'/'+id+(t==='tv'?'/'+s+'/'+e:'')+'?'+(l?'lang='+l+'&':'')+(q?'quality='+q:'')},
 {n:'VidSrc.to',tmdb:0,u:(id,t)=>'https://vidsrc.to/embed/'+t+'/'+id+'?ds_lang='+(state.audio==='original'?'en':state.audio)},
 {n:'VidSrc.xyz',tmdb:0,u:(id,t)=>'https://vidsrc.xyz/embed/'+t+'/'+id+'?ds_lang='+(state.audio==='original'?'en':state.audio)},
 {n:'2Embed',tmdb:0,u:(id)=>'https://www.2embed.cc/embed/'+id},
 {n:'SuperEmbed',tmdb:0,u:(id,t)=>'https://multiembed.mov/?video_id='+id+'&tmdb=0'+(t==='tv'?'&s='+state.season+'&e='+state.ep:'')}
];

function order(){
  let l=SERVERS.map((s,i)=>i).filter(i=>SERVERS[i].tmdb?!!state.tmdb:true);
  if(state.audio!=='original'){
    const L=l.filter(i=>SERVERS[i].lang), O=l.filter(i=>!SERVERS[i].lang);
    l=[...L,...O];
  }
  return l;
}

/* ---------- catalog ---------- */
function catURL(type,cat,genre,skip,search){
  let u=API+'/catalog/'+type+'/'+cat;
  if(genre)u+='/genre='+encodeURIComponent(genre);
  u+='.json?skip='+(skip||0);
  if(search)u+='&search='+encodeURIComponent(search);
  return u;
}

const ROWS=[
 {t:'ट्रेंडिंग फ़िल्में',type:'movie',cat:'top'},
 {t:'ट्रेंडिंग वेब सीरीज़',type:'series',cat:'top'},
 {t:'Action',type:'movie',cat:'top',g:'Action'},
 {t:'Comedy',type:'movie',cat:'top',g:'Comedy'},
 {t:'Drama सीरीज़',type:'series',cat:'top',g:'Drama'},
 {t:'Sci-Fi',type:'movie',cat:'top',g:'Sci-Fi'},
 {t:'Horror',type:'movie',cat:'top',g:'Horror'},
 {t:'Romance',type:'movie',cat:'top',g:'Romance'},
 {t:'Thriller सीरीज़',type:'series',cat:'top',g:'Thriller'},
 {t:'Animation',type:'movie',cat:'top',g:'Animation'},
 {t:'Crime सीरीज़',type:'series',cat:'top',g:'Crime'},
 {t:'Documentary',type:'movie',cat:'top',g:'Documentary'}
];

function cardHTML(it,type){
  const p=it.poster||('https://images.metahub.space/poster/medium/'+it.id+'/img');
  return '<div class="card" data-id="'+it.id+'" data-type="'+(it.type||type)+'">'+
    '<img loading="lazy" src="'+p+'" onerror="this.style.background=\'linear-gradient(160deg,#26263a,#12121a)\';this.removeAttribute(\'src\')">'+
    '<span class="cn">'+(it.name||'')+'</span></div>';
}

function bindCards(root){
  root.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>openDetail(c.dataset.id,c.dataset.type);
  });
}

async function buildRows(){
  const rowsEl=$('#rows');rowsEl.innerHTML='';
  for(const r of ROWS){
    try{
      const d=await J(catURL(r.type,r.cat,r.g,0,''));
      if(!d.metas||!d.metas.length)continue;
      const div=document.createElement('div');div.className='row';
      div.innerHTML='<h2>'+r.t+' <b data-t="'+r.t+'" data-type="'+r.type+'" data-g="'+(r.g||'')+'">सभी देखें ›</b></h2>'+
        '<div class="track">'+d.metas.slice(0,18).map(m=>cardHTML(m,r.type)).join('')+'</div>';
      div.querySelector('b').onclick=()=>browse(r.type,r.g);
      rowsEl.appendChild(div);
      bindCards(div);
    }catch(e){}
  }
  heroPick();
}

async function heroPick(){
  try{
    const d=await J(catURL('movie','top',null,0,''));
    const picks=(d.metas||[]).slice(0,6);
    if(!picks.length)return;
    const m=picks[Math.floor(Math.random()*picks.length)];
    const bg=m.background||('https://images.metahub.space/background/medium/'+m.id+'/img');
    $('#hero').style.backgroundImage='url('+bg+')';
    $('#hero').innerHTML='<div class="hero-in"><h1>'+m.name+'</h1>'+
      '<div class="meta">'+(m.releaseInfo?'<span>'+m.releaseInfo+'</span>':'')+(m.imdbRating?'<span class="rate">★ '+m.imdbRating+'</span>':'')+'<span>HD</span></div>'+
      '<p>'+(m.description||'')+'</p>'+
      '<button class="btn" onclick="openDetail(\''+m.id+'\',\'movie\')">▶ चलाएं</button> '+
      '<button class="btn ghost" onclick="openDetail(\''+m.id+'\',\'movie\')">ℹ जानकारी</button></div>';
  }catch(e){}
}

function goHome(){
  state.search='';$('#q').value='';
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  buildRows();window.scrollTo(0,0);
}

async function browse(type,g){
  state.type=type;state.gen=g||null;state.skip=0;state.search='';
  $('#hero').style.backgroundImage='';$('#hero').innerHTML='';
  $('#detail').classList.add('hidden');
  const app=$('#app');app.classList.remove('hidden');
  $('#rows').innerHTML='<div class="row"><h2>'+(g?g+' — ':'')+(type==='movie'?'फ़िल्में':'वेब सीरीज़')+'</h2><div class="grid" id="gGrid"></div></div>';
  $('#rows').className='';
  $('#hero').classList.add('hidden');
  await more();
  window.scrollTo(0,0);
}

async function more(){
  const g=$('#gGrid');if(!g)return;
  try{
    const d=await J(catURL(state.type,'top',state.gen,state.skip,state.search));
    if(!d.metas||!d.metas.length)return;
    const frag=document.createElement('div');
    frag.innerHTML=d.metas.map(m=>cardHTML(m,state.type)).join('');
    [...frag.children].forEach(c=>g.appendChild(c));
    bindCards(g);
    state.skip+=d.metas.length;
  }catch(e){}
}

/* search */
let sT;
$('#q').oninput=e=>{
  clearTimeout(sT);
  const v=e.target.value.trim();
  sT=setTimeout(()=>{
    if(!v){goHome();return}
    doSearch(v);
  },420);
};

async function doSearch(v){
  state.search=v;
  $('#hero').classList.add('hidden');$('#hero').innerHTML='';
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#rows').innerHTML='<div class="row"><h2>"'+v+'" के नतीजे</h2><div class="grid" id="gGrid"></div></div>';
  state.skip=0;
  try{
    const [a,b]=await Promise.all([J(catURL('movie','top',null,0,v)),J(catURL('series','top',null,0,v))]);
    const all=[...(a.metas||[]),...(b.metas||[])];
    const g=$('#gGrid');
    if(!all.length){g.innerHTML='<div class="load">कुछ नहीं मिला</div>';return}
    const frag=document.createElement('div');
    frag.innerHTML=all.map(m=>cardHTML(m,m.type)).join('');
    [...frag.children].forEach(c=>g.appendChild(c));
    bindCards(g);
  }catch(e){}
}

/* ---------- detail ---------- */
async function openDetail(id,type){
  try{
    const d=await J(API+'/meta/'+type+'/'+id+'.json');
    const m=d.meta;if(!m)throw 0;
    state.imdb=id;state.type=type;state.title=m.name;
    state.tmdb=m.moviedb_id||m.tmdb_id||null;
    state.season=1;state.ep=1;

    $('#app').classList.add('hidden');
    const det=$('#detail');det.classList.remove('hidden');
    const bg=m.background||('https://images.metahub.space/background/medium/'+id+'/img');

    let eps='';
    if(type==='series'&&m.videos&&m.videos.length){
      const seasons=[...new Set(m.videos.map(v=>v.season))].filter(s=>s>0).sort((a,b)=>a-b);
      eps='<div class="stabs">'+seasons.map(s=>'<div class="chip'+(s===1?' on':'')+'" data-s="'+s+'">सीज़न '+s+'</div>').join('')+'</div><div id="eps"></div>';
      state._vids=m.videos;
    }else state._vids=null;

    det.innerHTML='<button class="back" onclick="closeDetail()">←</button>'+
      '<div class="dback" style="background-image:url('+bg+')"></div>'+
      '<div class="dwrap"><h1>'+(m.name||'')+'</h1>'+
      '<div class="meta">'+(m.releaseInfo?'<span>'+m.releaseInfo+'</span>':'')+(m.runtime?'<span>'+m.runtime+'</span>':'')+(m.imdbRating?'<span class="rate">★ '+m.imdbRating+'</span>':'')+'</div>'+
      '<div class="chips">'+(m.genres||[]).map(g=>'<span class="chip">'+g+'</span>').join('')+'</div>'+
      '<p class="desc">'+(m.description||'')+'</p>'+
      '<div class="lbl">🔊 Audio</div><div class="chips" id="aChips"></div>'+
      '<div class="lbl">⚙️ Quality</div><div class="chips" id="qChips"></div>'+
      '<div style="margin:22px 0;display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn red" id="playBtn">▶ चलाएं</button>'+
        '<button class="btn ghost" id="listBtn">＋ मेरी लिस्ट</button>'+
      '</div>'+eps+'</div>';

    renderAudioChips();renderQualChips();
    $('#playBtn').onclick=()=>play();
    $('#listBtn').onclick=()=>toggleList(id,m.name,m.poster,type);

    if(state._vids){
      const tabs=det.querySelectorAll('.stabs .chip');
      tabs.forEach(t=>t.onclick=()=>{
        tabs.forEach(x=>x.classList.remove('on'));t.classList.add('on');
        renderEps(+t.dataset.s);
      });
      renderEps(1);
    }
    window.scrollTo(0,0);
  }catch(e){toast('जानकारी नहीं मिली')}
}

function renderAudioChips(){
  const c=$('#aChips');if(!c)return;
  c.innerHTML=AUDIO.map(a=>'<div class="chip'+(state.audio===a[0]?' on':'')+'" data-a="'+a[0]+'">'+a[1]+'</div>').join('');
  c.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{audioSet(x.dataset.a);renderAudioChips()});
}
function renderQualChips(){
  const c=$('#qChips');if(!c)return;
  c.innerHTML=QUAL.map(a=>'<div class="chip'+(state.q===a[0]?' on':'')+'" data-q="'+a[0]+'">'+a[1]+'</div>').join('');
  c.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{state.q=x.dataset.q;renderQualChips();syncQ()});
}

function renderEps(s){
  const box=$('#eps');if(!box)return;
  const list=state._vids.filter(v=>v.season===s).sort((a,b)=>a.number-b.number);
  box.innerHTML=list.map(v=>'<div class="ep" data-e="'+v.number+'">'+
    '<img loading="lazy" src="'+(v.thumbnail||('https://images.metahub.space/background/medium/'+state.imdb+'/img'))+'" onerror="this.style.background=\'#22222e\'">'+
    '<div><div class="en">'+v.number+'. '+(v.name||'Episode '+v.number)+'</div><div class="eo">'+(v.overview||'')+'</div></div></div>').join('');
  box.querySelectorAll('.ep').forEach(e=>e.onclick=()=>{
    state.season=s;state.ep=+e.dataset.e;play();
  });
}

function closeDetail(){$('#detail').classList.add('hidden');$('#app').classList.remove('hidden');goHome()}

/* ---------- list ---------- */
function getList(){try{return JSON.parse(localStorage.getItem('nfx_list')||'[]')}catch(e){return[]}}
function toggleList(id,name,poster,type){
  let l=getList();const i=l.findIndex(x=>x.id===id);
  if(i>-1){l.splice(i,1);toast('लिस्ट से हटाया')}
  else{l.push({id,name,poster,type});toast('लिस्ट में जोड़ा')}
  localStorage.setItem('nfx_list',JSON.stringify(l));
}
function showList(){
  const l=getList();
  $('#hero').classList.add('hidden');$('#hero').innerHTML='';
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#rows').innerHTML='<div class="row"><h2>मेरी लिस्ट</h2><div class="grid" id="gGrid">'+
    (l.length?l.map(m=>cardHTML(m,m.type)).join(''):'<div class="load">खाली है</div>')+'</div></div>';
  bindCards($('#rows'));
}

/* ---------- player ---------- */
function audioSet(code){
  state.audio=code;
  localStorage.setItem('nfx_audio',code);
  syncAudio();
  if(state.open)reloadSmart();
}
function syncAudio(){
  const t=$('#pAudioTxt');if(t)t.textContent=lbl(state.audio);
  const b=$('#pAudioBtn');
  if(b)b.classList.toggle('act',state.audio!=='original');
  const m=$('#mAudio');
  if(m)m.querySelectorAll('div').forEach(d=>d.classList.toggle('on',d.dataset.a===state.audio));
}
function syncQ(){$('#pQualTxt').textContent=qlbl(state.q);if(state.open)loadFrame()}

function buildMenus(){
  $('#mAudio').innerHTML=AUDIO.map(a=>'<div data-a="'+a[0]+'" class="'+(state.audio===a[0]?'on':'')+'">'+a[1]+'</div>').join('');
  $('#mAudio').querySelectorAll('div').forEach(d=>d.onclick=()=>{audioSet(d.dataset.a);hideMenus()});
  $('#mQual').innerHTML=QUAL.map(a=>'<div data-q="'+a[0]+'" class="'+(state.q===a[0]?'on':'')+'">'+a[1]+'</div>').join('');
  $('#mQual').querySelectorAll('div').forEach(d=>d.onclick=()=>{state.q=d.dataset.q;syncQ();hideMenus()});
  $('#mSub').innerHTML=AUDIO.filter(a=>a[0]!=='original').map(a=>'<div data-s="'+a[0]+'" class="'+(state.sub===a[0]?'on':'')+'">'+a[1]+'</div>').join('');
  $('#mSub').querySelectorAll('div').forEach(d=>d.onclick=()=>{
    state.sub=d.dataset.s;$('#pSubTxt').textContent=lbl(state.sub);
    $('#mSub').querySelectorAll('div').forEach(x=>x.classList.toggle('on',x.dataset.s===state.sub));
    loadFrame();hideMenus();
  });
}
function toggleMenu(id){
  const m=$('#'+id);const open=!m.classList.contains('hidden');
  hideMenus();if(!open)m.classList.remove('hidden');
}
function hideMenus(){document.querySelectorAll('.menu').forEach(m=>m.classList.add('hidden'))}

function play(){
  const o=order();
  if(!o.length){toast('कोई सर्वर उपलब्ध नहीं');return}
  state.srv=o[0];state.tries=0;state.open=true;
  $('#player').classList.remove('hidden');
  $('#pTitle').textContent=state.title+(state.type==='series'?' · S'+state.season+'E'+state.ep:'');
  buildMenus();syncAudio();$('#pQualTxt').textContent=qlbl(state.q);
  loadFrame();
}

function loadFrame(){
  const s=SERVERS[state.srv];
  if(!s)return;
  const l=state.audio==='original'?'':state.audio;
  const id=s.tmdb?state.tmdb:state.imdb;
  if(!id){nextServer();return}
  let url=s.u(id,state.type==='series'?'tv':'movie',state.season,state.ep,s.q?state.q:'',l);
  if(state.sub&&s.lang)url+='&sub_lang='+state.sub;
  $('#pSrvName').textContent=s.n;
  $('#frame').src=url;
  $('#pSrvBtn').classList.toggle('act',s.lang&&state.audio!=='original');
  clearTimeout(state._to);
  state._to=setTimeout(()=>{if(state.tries<2){state.tries++;nextServer(true)}},11000);
}

function reloadSmart(){
  const s=SERVERS[state.srv];
  if(state.audio!=='original'&&!s.lang){
    const i=SERVERS.findIndex(x=>x.lang&&(x.tmdb?!!state.tmdb:true));
    if(i>-1)state.srv=i;
  }
  state.tries=0;
  loadFrame();
}

function nextServer(auto){
  const o=order();
  const pos=o.indexOf(state.srv);
  const nxt=o[pos+1];
  if(nxt===undefined){
    if(!auto)toast('सभी सर्वर आज़माए जा चुके');
    return;
  }
  state.srv=nxt;
  loadFrame();
}

function openTab(){
  const s=SERVERS[state.srv];if(!s)return;
  const l=state.audio==='original'?'':state.audio;
  const id=s.tmdb?state.tmdb:state.imdb;
  window.open(s.u(id,state.type==='series'?'tv':'movie',state.season,state.ep,s.q?state.q:'',l),'_blank');
}

function closePlayer(){
  state.open=false;clearTimeout(state._to);
  $('#frame').src='about:blank';
  $('#player').classList.add('hidden');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(state.open)closePlayer()}
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.rel'))hideMenus();
});

/* infinite scroll */
new IntersectionObserver(es=>{
  if(es[0].isIntersecting&&$('#gGrid')&&state.search!=='')more();
},{rootMargin:'300px'}).observe($('#sentinel'));

/* init */
state.q='';
buildRows();
</script>
</body>
</html>
