<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<title>TUNAmovies</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#08090d;color:#f2f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
.glass{background:rgba(22,24,32,.62);border:1px solid rgba(255,255,255,.10);box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
:root{--red:#e50914;--red2:#ff2d3f}
#hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(8,9,13,.96),rgba(8,9,13,.72));backdrop-filter:blur(14px)}
.logo{font-weight:900;letter-spacing:-.6px;font-size:20px;color:#fff}
.logo b{color:var(--red)}
#hdr .sp{flex:1}
.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:16px}
.ico:active{transform:scale(.94)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e50914,#7a1bff);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
#sbar{padding:0 14px 10px;display:flex;gap:8px}
#sbar input{flex:1;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:15px;outline:none}
#sbar input::placeholder{color:#8b90a0}
#hero{position:relative;height:56vh;min-height:330px;margin-bottom:-40px}
#hero img{width:100%;height:100%;object-fit:cover;display:block}
#hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,13,.15) 0%,rgba(8,9,13,.35) 45%,rgba(8,9,13,.98) 100%)}
#hero .info{position:absolute;left:0;right:0;bottom:56px;padding:0 18px}
#hero h1{font-size:29px;line-height:1.1;margin:0 0 8px;font-weight:900;text-shadow:0 2px 18px rgba(0,0,0,.85)}
#hero .m{font-size:12.5px;color:#c3c8d4;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
#hero .btns{display:flex;gap:10px}
.btn{padding:12px 20px;border-radius:13px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.btn.play{background:#fff;color:#08090d}
.btn.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff}
.btn:active{transform:scale(.96)}
.row{margin:26px 0}
.row h2{font-size:16px;margin:0 0 10px;padding:0 14px;font-weight:800}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:112px}
.card .ph{position:relative;width:112px;height:164px;border-radius:13px;overflow:hidden;background:#171a22;border:1px solid rgba(255,255,255,.07)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{font-size:12px;color:#c9cedb;margin-top:6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card:active{transform:scale(.96)}
.badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.16);font-size:10px;font-weight:800;padding:3px 6px;border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.grid .ph{width:100%;height:0;padding-bottom:148%;position:relative;border-radius:12px;overflow:hidden;background:#171a22}
.grid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid .t{font-size:11.5px;color:#c9cedb;margin-top:5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid>div:active{transform:scale(.97)}
h3.sec{font-size:17px;padding:14px 14px 0;margin:0}
.empty{padding:60px 20px;text-align:center;color:#8b90a0;font-size:14px}
.retry{margin-top:12px;padding:11px 20px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-weight:800;font-size:13px}
#det{padding-bottom:40px}
#det .top{position:relative;height:44vh;min-height:260px}
#det .top img{width:100%;height:100%;object-fit:cover}
#det .top .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,13,.2),rgba(8,9,13,.97))}
#det .body{padding:0 16px;margin-top:-70px;position:relative}
#det h1{font-size:25px;margin:0 0 6px;font-weight:900}
#det .m{font-size:12.5px;color:#b9bfcd;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
#det p.desc{font-size:13.5px;line-height:1.6;color:#c3c8d4;margin:0 0 16px}
.eps{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ep{display:flex;gap:11px;padding:9px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.ep img{width:96px;height:56px;object-fit:cover;border-radius:9px;background:#171a22;flex:0 0 auto}
.ep .n{font-size:13px;font-weight:800}
.ep .d{font-size:11.5px;color:#9aa1b2;line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep:active{transform:scale(.985)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 15px;border-radius:11px;font-size:13px;font-weight:800;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.tab.on{background:#fff;color:#08090d}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:rgba(10,11,16,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#8b90a0;padding:6px 0;font-weight:700}
#nav button.on{color:#fff}
#nav .g{font-size:18px;line-height:1}
#app{padding-bottom:74px}
#pl{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#000}
#plTop{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:#0d0f15;border-bottom:1px solid rgba(255,255,255,.08);flex:0 0 auto}
#plTop .tt{flex:1;min-width:0}
#plTop .tt .a{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plTop .tt .b{font-size:11px;color:#8b90a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;position:relative;background:#000;display:flex}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#plBot{flex:0 0 auto;display:flex;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0d0f15;border-top:1px solid rgba(255,255,255,.08);overflow-x:auto;scrollbar-width:none;align-items:center}
#plBot::-webkit-scrollbar{display:none}
#plBot select{flex:0 0 auto;padding:9px 11px;border-radius:11px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;outline:none;-webkit-appearance:none;appearance:none}
#plBot .nx{flex:0 0 auto;padding:9px 13px;border-radius:11px;font-size:12.5px;font-weight:800;background:var(--red);color:#fff;white-space:nowrap}
#plBot .gh{flex:0 0 auto;padding:9px 13px;border-radius:11px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
#plBot button:active,#plBot .nx:active{transform:scale(.95)}
#plHint{flex:0 0 auto;font-size:11.5px;color:#8b90a0;padding:0 4px;white-space:nowrap}
#plAud{box-shadow:inset 0 0 0 1px rgba(229,9,20,.6);font-weight:800}
.sheet{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet .in{width:100%;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;background:#12141c;border-top:1px solid rgba(255,255,255,.1);padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px;font-size:17px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#9aa1b2;margin-bottom:5px;font-weight:700}
.fld input,.fld select{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:#fff;font-size:14.5px;outline:none}
.wide{width:100%;justify-content:center;padding:14px;border-radius:14px;font-weight:800;font-size:15px}
.red{background:var(--red);color:#fff}
.sub{font-size:12px;color:#8b90a0;text-align:center;margin-top:12px;line-height:1.5}
.err{color:#ff6b76;font-size:12.5px;margin-bottom:10px}
#auth{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%,#241017,#08090d 70%)}
#auth .box{width:100%;max-width:360px;padding:24px;border-radius:22px}
#auth h2{margin:0 0 4px;font-size:24px}
#auth .s{font-size:13px;color:#9aa1b2;margin-bottom:18px}
.sw{display:flex;gap:8px;margin-bottom:16px}
.sw button{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:800;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.sw button.on{background:#fff;color:#08090d}
.lv{display:flex;flex-direction:column;gap:9px;padding:14px}
.lvi{display:flex;gap:11px;align-items:center;padding:11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.lvi .lg{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#171a22;flex:0 0 auto}
.lvi .in2{flex:1;min-width:0}
.lvi .t{font-size:13px;font-weight:800;line-height:1.25}
.lvi .c{font-size:11px;color:#8b90a0;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red2);flex:0 0 auto}
</style>
</head>
<body>

<div id="app">
  <header id="hdr">
    <div class="logo">TUNA<b>movies</b></div>
    <div class="sp"></div>
    <button class="ico" id="bSearch">&#128269;</button>
    <button class="av" id="bAcc">T</button>
  </header>
  <div id="sbar" class="hidden"><input id="q" placeholder="Search movies, series..." autocomplete="off"></div>
  <main id="main"></main>
</div>

<nav id="nav">
  <button data-v="home" class="on"><span class="g">&#127968;</span>Home</button>
  <button data-v="movie"><span class="g">&#127916;</span>Movies</button>
  <button data-v="series"><span class="g">&#128250;</span>Series</button>
  <button data-v="live"><span class="g">&#9917;</span>Live</button>
  <button data-v="list"><span class="g">&#128278;</span>My List</button>
</nav>

<div id="pl" class="hidden">
  <div id="plTop">
    <button class="ico" id="plBack">&#8592;</button>
    <div class="tt"><div class="a" id="plTitle"></div><div class="b" id="plSub"></div></div>
    <button class="ico" id="plFs">&#9974;</button>
  </div>
  <div id="stage"></div>
  <div id="plBot">
    <select id="plSrv"></select>
    <select id="plQual"></select>
    <select id="plAud"></select>
    <button class="nx" id="plNext">Next &#9654;</button>
    <button class="gh" id="plNew">New tab</button>
    <span id="plHint">If grey, tap Next</span>
  </div>
</div>

<div id="setSheet" class="sheet hidden">
  <div class="in">
    <h3>Settings</h3>
    <div class="fld"><label>Default quality</label>
      <select id="setQual">
        <option value="2160">4K (2160p)</option>
        <option value="1440">2K (1440p)</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="auto">Auto</option>
      </select>
    </div>
    <div class="fld"><label>Default audio</label>
      <select id="setAud">
        <option value="auto">Auto (title ki original bhasha)</option>
        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368; (Hindi)</option>
        <option value="en">English</option>
        <option value="orig">Sirf original</option>
      </select>
    </div>
    <div class="fld"><label>Default server</label><select id="setSrv"></select></div>
    <button class="wide red" id="setSave">Save</button>
    <div class="sub">Turn off Brave Shields for this site if the player stays grey.</div>
  </div>
</div>

<div id="upSheet" class="sheet hidden">
  <div class="in">
    <h3>Upload video</h3>
    <div class="fld"><label>Title</label><input id="upTitle" placeholder="My video"></div>
    <div class="fld"><label>Video file</label><input id="upFile" type="file" accept="video/*"></div>
    <button class="wide red" id="upGo">Upload &amp; play</button>
    <div class="sub">Stored on this device only (IndexedDB).</div>
  </div>
</div>

<div id="auth" class="hidden">
  <div class="box glass">
    <h2>TUNAmovies</h2>
    <div class="s">Sign in to save your list and progress.</div>
    <div class="sw"><button id="mEmail" class="on">Email</button><button id="mPhone">Mobile</button></div>
    <div class="fld"><label id="idLbl">Email</label><input id="idIn" placeholder="you@mail.com" autocomplete="off"></div>
    <div class="fld"><label>Password</label><input id="pwIn" type="password" placeholder="min 6 chars"></div>
    <div class="err hidden" id="aErr"></div>
    <button class="wide red" id="aGo">Sign in</button>
    <div class="sub"><a href="#" id="aSkip">Continue as guest</a></div>
  </div>
</div>

<script>
"use strict";
const API="https://v3-cinemeta.strem.io";
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const state={
  view:"home", cache:{}, prog:LS.get("nfx_prog",{}), list:LS.get("nfx_list",[]),
  set:Object.assign({qual:"1080",aud:"auto",srv:"vidfast"},LS.get("nfx_set",{})),
  item:null, s:1, e:1, srv:0, qual:"1080", aud:"hi", qFall:0, touched:false, timer:null,
  playId:null, playType:"movie", orig:"", origName:"", audioList:[], tmdb:"", pos:0, posTimer:null
};

/* aud: 0 = audio track badal sakta hai (sabse behtar) ... 3 = nahi badal sakta
   resume: true = startAt se position le sakta hai
   need: "tmdb" = TMDB id zaroori */
const SRV=[
 {id:"vidcore",name:"VidCore",aud:0,resume:false,need:"tmdb",
  u:(c,l)=>"https://vidcore.org/embed/"+(c.t==="movie"?"movie/"+c.tmdb:"tv/"+c.tmdb+"/"+c.s+"/"+c.e)+"?autoplay=1&quality="+(c.q==="auto"?"auto":c.q)+aq(l)},
 {id:"apiplayer",name:"APIPlayer",aud:0,resume:false,need:"tmdb",
  u:(c,l)=>"https://apiplayer.ru/embed/"+(c.t==="movie"?"movie/"+c.tmdb:"tv/"+c.tmdb+"/"+c.s+"/"+c.e)+"?autoplay=1"+aq(l)},
 {id:"vidsrcme",name:"VidSrc",aud:1,resume:true,need:"imdb",
  u:(c,l)=>"https://vidsrc.me/embed/"+(c.t==="movie"?"movie?imdb="+c.id:"tv?imdb="+c.id+"&season="+c.s+"&episode="+c.e)+"&autoplay=1&startAt="+Math.max(0,Math.floor(c.pos))+aq(l)},
 {id:"vidfast",name:"VidFast",aud:2,resume:true,need:"imdb",
  u:(c,l)=>"https://vidfast.pro/"+(c.t==="movie"?"movie/"+c.id:"tv/"+c.id+"/"+c.s+"/"+c.e)+"?autoPlay=true&quality="+(c.q==="auto"?"auto":c.q)+"&startAt="+Math.max(0,Math.floor(c.pos))+aq(l)},
 {id:"multiembed",name:"MultiEmbed",aud:3,resume:false,need:"imdb",
  u:(c)=>"https://multiembed.mov/?video_id="+c.id+"&tmdb=0"+(c.t==="movie"?"":"&s="+c.s+"&e="+c.e)},
 {id:"2embed",name:"2Embed",aud:3,resume:false,need:"imdb",
  u:(c)=>"https://www.2embed.cc/"+(c.t==="movie"?"embed/"+c.id:"embedtv/"+c.id+"&s="+c.s+"&e="+c.e)}
];
/* ek saath saare known audio param naam — jo valid hai wo lag jaayega */
function aq(l){return "&audio="+l+"&lang="+l+"&audio_lang="+l+"&al="+l+"&dub="+l}

const QL=[["2160","4K"],["1440","2K"],["1080","1080p"],["720","720p"],["auto","Auto"]];
const LNAME={hi:"\u0939\u093f\u0928\u094d\u0926\u0940",en:"English",es:"Espa\u00f1ol",fr:"Fran\u00e7ais",de:"Deutsch",it:"Italiano",pt:"Portugu\u00eas",ru:"\u0420\u0443\u0441\u0441\u043a\u0438\u0439",ja:"\u65e5\u672c\u8a9e",ko:"\ud55c\uad6d\uc5b4",zh:"\u4e2d\u6587",ar:"\u0627\u0644\u0639\u0631\u0628\u064a\u0629",tr:"T\u00fcrk\u00e7e",ta:"\u0ba4\u0bae\u0bbf\u0bb4\u0bcd",te:"\u0c24\u0c46\u0c32\u0c41\u0c17\u0c41",ml:"\u0d2e\u0d32\u0d2f\u0d3e\u0d32\u0d02",kn:"\u0c95\u0ca8\u0ccd\u0ca8\u0ca1",bn:"\u09ac\u09be\u0982\u09b2\u09be",mr:"\u092e\u0930\u093e\u0920\u0940",pa:"\u0a2a\u0a70\u0a1c\u0a3e\u0a2c\u0a40",nl:"Nederlands",pl:"Polski",sv:"Svenska",id:"Bahasa",th:"\u0e44\u0e17\u0e22",fa:"\u0641\u0627\u0631\u0633\u06cc",he:"\u05e2\u05d1\u05e8\u05d9\u05ea",el:"\u0395\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03ac",uk:"\u0423\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u0430",ro:"Rom\u00e2n\u0103",cs:"\u010ce\u0161tina",hu:"Magyar",da:"Dansk",fi:"Suomi",no:"Norsk"};

const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=(u)=>u||"data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="112" height="164"><rect width="100%" height="100%" fill="#171a22"/></svg>');

async function jget(url){
  if(state.cache[url])return state.cache[url];
  let r;
  try{ r=await fetch(url,{cache:"no-store"}); }
  catch(e){ r=await fetch(url); }
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  state.cache[url]=d;
  return d;
}
async function catalog(type,cat,extra){
  const u=API+"/catalog/"+(type||"movie")+"/"+(cat||"top")+(extra?"/"+extra:"")+".json";
  const d=await jget(u);
  return (d.metas||[]).filter(m=>m&&m.id&&m.poster);
}
const meta=(t,id)=>jget(API+"/meta/"+(t||"movie")+"/"+id+".json").then(d=>d.meta||null);

const LANG_CACHE=LS.get("nfx_lang",{});
async function loadLang(id){
  if(LANG_CACHE[id])return LANG_CACHE[id];
  const q='SELECT ?code ?tmdbM ?tmdbT WHERE { ?f wdt:P345 "'+id+'". '+
    'OPTIONAL { ?f wdt:P364 ?l. ?l wdt:P218 ?code. } '+
    'OPTIONAL { ?f wdt:P4947 ?tmdbM. } OPTIONAL { ?f wdt:P4983 ?tmdbT. } } LIMIT 1';
  try{
    const r=await fetch("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(q),{headers:{Accept:"application/sparql-results+json"}});
    if(!r.ok)return null;
    const d=await r.json();
    const b=(d.results&&d.results.bindings&&d.results.bindings[0])||{};
    const out={code:b.code?b.code.value.toLowerCase():"",tmdb:(b.tmdbM||b.tmdbT||{}).value||""};
    LANG_CACHE[id]=out;LS.set("nfx_lang",LANG_CACHE);
    return out;
  }catch(e){return null}
}

function buildAudio(orig){
  const L=[];
  if(orig)L.push({v:orig,label:(LNAME[orig]||orig.toUpperCase()),orig:true});
  else L.push({v:"original",label:"Original",orig:true});
  if(orig!=="hi")L.push({v:"hi",label:"\u0939\u093f\u0928\u094d\u0926\u0940"});
  if(orig!=="en")L.push({v:"en",label:"English"});
  return L;
}
function defaultAudio(orig){
  const s=state.set.aud;
  if(s==="hi")return "hi";
  if(s==="en")return "en";
  if(s==="orig")return orig||"original";
  if(orig==="hi")return "hi";
  if(orig==="en")return "en";
  return orig||"original";
}
const srvOk=s=>s.need!=="tmdb"||!!state.tmdb;
const audLabel=v=>{const o=state.audioList.find(x=>x.v===v);return o?o.label:(LNAME[v]||v)};

/* non-original language ke liye sabse achha audio-capable server */
function audioServer(){
  const cands=SRV.map((s,i)=>({s,i})).filter(o=>o.s.aud<=1&&srvOk(o.s)).sort((a,b)=>a.s.aud-b.s.aud);
  return cands.length?cands[0].i:null;
}

async function renderBrowse(type){

    try{
      const list=await catalog(type,"top",(cur?"genre="+cur:"")+(skip?((cur?"&":"")+"skip="+skip):""));

  if(type==="series"&&d.videos&&d.videos.length){

        [...tabs.children].forEach(t=>t.classList.toggle("on",+t.dataset.s===curS));

    playBtn.onclick=()=>play(p.type||type,id,p.s,p.e);

function play(type,id,s,e){
  const it=state.item&&state.item.id===id?state.item:null;
  const name=it?it.name:(state.prog[id]&&state.prog[id].name)||"Playing";
  state.item=it||{id,name,poster:(state.prog[id]||{}).poster};
  state.s=s;state.e=e;state.touched=false;state.qFall=0;state.pos=0;
  state.qual=state.set.qual;
  state.aud=defaultAudio(state.orig);

  let i=SRV.findIndex(x=>x.id===state.set.srv);
  if(i<0||!srvOk(SRV[i]))i=0;
  // agar non-original audio chahiye to audio-capable server se shuru karo
  if(state.aud!==state.orig&&state.aud!=="original"&&SRV[i].aud>1){
    const a=audioServer();if(a!==null)i=a;
  }
  state.srv=i;
  state.playId=id;state.playType=type;

  $("#pl").classList.remove("hidden");
  document.body.style.overflow="hidden";
  $("#plTitle").textContent=name;
  $("#plSub").textContent=type==="series"?("S"+s+" E"+e+" \u00b7 "):"";
  fillSelects();mount();
  history.pushState({pl:1},"");
}

function fillSelects(){
  const sv=$("#plSrv");sv.innerHTML="";
  SRV.forEach((x,i)=>{if(srvOk(x))sv.add(new Option(x.name,i))});
  sv.value=state.srv;
  sv.onchange=()=>{state.srv=+sv.value;state.qFall=0;state.touched=true;mount()};

  const q=$("#plQual");q.innerHTML="";
  QL.forEach(([v,l])=>q.add(new Option(l,v)));
  q.value=state.qual;
  q.onchange=()=>{state.qual=q.value;state.qFall=0;state.touched=true;mount()};

  const a=$("#plAud");a.innerHTML="";
  (state.audioList.length?state.audioList:buildAudio(state.orig)).forEach(o=>a.add(new Option(o.label+(o.orig?" \u2022 original":""),o.v)));
  a.value=state.aud;
  a.onchange=()=>{
    state.aud=a.value;state.touched=true;state.qFall=0;
    const isOrig=state.aud===state.orig||state.aud==="original";
    // agar current server audio nahi badal sakta -> audio-capable server par jao
    if(!isOrig&&SRV[state.srv].aud>1){
      const k=audioServer();
      if(k!==null){state.srv=k;sv.value=k}
    }
    $("#plHint").textContent="Audio: "+audLabel(state.aud);
    mount();
  };

  $("#plNext").onclick=()=>{state.touched=true;next()};
  $("#plNew").onclick=()=>window.open(curUrl(),"_blank");
  $("#plBack").onclick=closePlayer;
  $("#plFs").onclick=()=>{
    const p=$("#pl");
    if(document.fullscreenElement)document.exitFullscreen();
    else if(p.requestFullscreen)p.requestFullscreen().catch(()=>{});
    else if(p.webkitRequestFullscreen)p.webkitRequestFullscreen();
  };
}

function curUrl(){
  const s=SRV[state.srv];
  const q=state.qFall>0?QL[Math.min(state.qFall,3)][0]:state.qual;
  const l=state.aud||state.orig||"original";
  return s.u({t:state.playType,id:state.playId,s:state.s,e:state.e,q,pos:state.pos,tmdb:state.tmdb},l);
}

function mount(){
  clearTimeout(state.timer);clearInterval(state.posTimer);
  const st=$("#stage");st.innerHTML="";
  const f=document.createElement("iframe");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("allow","autoplay; encrypted-media; fullscreen; picture-in-picture");
  f.setAttribute("referrerpolicy","origin");
  f.src=curUrl();
  st.appendChild(f);
  state.posTimer=setInterval(()=>{if(!document.hidden)state.pos++},1000);
  $("#plHint").textContent="Audio: "+audLabel(state.aud);
  state.timer=setTimeout(()=>{if(!state.touched)next()},22000);
}

function next(){
  clearTimeout(state.timer);
  if(state.qFall<3&&state.qual!=="auto"){state.qFall++;$("#plHint").textContent="Lowering quality...";mount();return}
  state.qFall=0;
  const avail=SRV.map((x,i)=>i).filter(i=>srvOk(SRV[i]));
  const at=avail.indexOf(state.srv);
  if(at>=0&&at<avail.length-1){
    state.srv=avail[at+1];$("#plSrv").value=state.srv;
    $("#plHint").textContent="Switched to "+SRV[state.srv].name;mount();return;
  }
  state.srv=avail[0]||0;$("#plSrv").value=state.srv;
  $("#plHint").textContent="All servers tried \u2014 use New tab";
  mount();
}

function closePlayer(){
  clearTimeout(state.timer);clearInterval(state.posTimer);
  $("#stage").innerHTML="";
  $("#pl").classList.add("hidden");
  document.body.style.overflow="";
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  if(state.playId){
    state.prog[state.playId]={t:Date.now(),s:state.s,e:state.e,name:$("#plTitle").textContent,poster:(state.item||{}).poster,type:state.playType};
    LS.set("nfx_prog",state.prog);
  }
}

  const u=LS.get("nfx_session",null);

  else setTimeout(openAuth,400);
  go("home");
})();
</script>
