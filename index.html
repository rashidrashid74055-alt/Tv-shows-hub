<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVAFLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--r:#e50914;--bg:#0b0b0f;--t:#fff;--m:#9a9aa6}
body{background:var(--bg);color:var(--t);font-family:'Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:14px 22px;background:linear-gradient(180deg,#0b0b0f 20%,rgba(11,11,15,.85) 70%,transparent);backdrop-filter:blur(8px)}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px;color:var(--r);cursor:pointer;white-space:nowrap}
.logo span{color:#fff}
nav{display:flex;gap:16px;font-size:14px;color:var(--m)}
nav a{cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:#fff;border-color:var(--r)}
.srch{margin-left:auto;display:flex;align-items:center;background:#1c1c26;border:1px solid #2c2c3a;border-radius:8px;padding:7px 12px;gap:8px;width:260px}
.srch input{background:none;border:0;outline:0;color:#fff;width:100%;font-size:14px}
@media(max-width:760px){nav{display:none}.srch{width:160px}}
main{padding-bottom:60px}
#hero{position:relative;height:62vh;min-height:380px;display:flex;align-items:flex-end;background-size:cover;background-position:center 20%;padding:30px 22px 40px}
#hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.15),rgba(11,11,15,.6) 55%,var(--bg))}
.hero-in{position:relative;z-index:2;max-width:640px}
.hero-in h1{font-size:clamp(26px,5vw,52px);line-height:1.05;margin-bottom:12px}
.hero-in p{color:#d3d3dd;font-size:14px;line-height:1.5;max-height:66px;overflow:hidden;margin-bottom:16px}
.meta{display:flex;gap:12px;font-size:13px;color:#cfcfda;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.rate{color:#46d369;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;background:#e6e6e6;color:#000}
.btn:hover{background:#fff}
.btn.ghost{background:rgba(90,90,110,.55);color:#fff}
.btn.ghost:hover{background:rgba(120,120,150,.7)}
.btn.red{background:var(--r);color:#fff}
.row{margin:26px 0 6px;padding:0 22px}
.row h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.row h2 b{font-size:12px;color:var(--m);font-weight:500;cursor:pointer}
.row h2 b:hover{color:#fff}
.track{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 148px;cursor:pointer}
.card img{width:148px;height:222px;object-fit:cover;border-radius:7px;background:#1e1e28;display:block}
.card:hover img{outline:2px solid var(--r)}
.card .cn{font-size:12px;color:#c8c8d4;margin-top:6px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:16px 22px}
.grid .card{flex:none;width:auto}
.grid .card img{width:100%;height:auto;aspect-ratio:2/3}
#sentinel{height:40px}
#detail{padding-bottom:60px}
.dback{position:relative;height:52vh;min-height:320px;background-size:cover;background-position:center 18%}
.dback::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.2),rgba(11,11,15,.75) 60%,var(--bg))}
.dwrap{max-width:900px;margin:-140px auto 0;position:relative;z-index:3;padding:0 22px}
.dwrap h1{font-size:clamp(24px,4vw,42px);margin-bottom:12px}
.dwrap .desc{color:#c9c9d6;font-size:14px;line-height:1.6;margin:14px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:8px 15px;border-radius:20px;background:#20202b;border:1px solid #31313f;font-size:13px;cursor:pointer;color:#d7d7e2}
.chip:hover{border-color:#555}
.chip.on{background:var(--r);border-color:var(--r);color:#fff;font-weight:700}
.lbl{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin-top:18px}
.stabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0 14px;padding-bottom:6px;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.ep{display:flex;gap:12px;padding:12px;border-radius:8px;cursor:pointer;border-bottom:1px solid #1d1d27}
.ep:hover{background:#16161f}
.ep img{width:130px;height:74px;object-fit:cover;border-radius:5px;background:#22222e;flex:0 0 auto}
.ep .en{font-size:14px;font-weight:600;margin-bottom:5px}
.ep .eo{font-size:12px;color:var(--m);line-height:1.45;max-height:54px;overflow:hidden}
#player{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:9px;padding:9px 14px;background:#0d0d12;border-bottom:1px solid #1e1e28;flex-wrap:wrap}
.pbar .pt{font-size:13px;font-weight:700;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}
.pb{background:#1d1d27;border:1px solid #2e2e3c;color:#e8e8f0;border-radius:6px;padding:7px 11px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pb:hover{background:#2a2a38}
.pb.act{background:var(--r);border-color:var(--r);color:#fff;font-weight:700}
.fwrap{flex:1;position:relative;background:#000}
.fwrap iframe{width:100%;height:100%;border:0;display:block}
.menu{position:absolute;top:100%;right:0;margin-top:6px;background:#15151d;border:1px solid #2c2c3a;border-radius:8px;padding:6px;min-width:150px;max-height:300px;overflow:auto;z-index:20;box-shadow:0 10px 30px #000a}
.menu div{padding:9px 12px;border-radius:5px;font-size:13px;cursor:pointer;white-space:nowrap}
.menu div:hover{background:#262633}
.menu div.on{color:var(--r);font-weight:700}
.rel{position:relative}
.tip{padding:8px 14px;background:#15151d;border-top:1px solid #1e1e28;font-size:12px;color:#a9a9b8;line-height:1.5}
.tip b{color:#fff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#e50914;color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:500;transition:.3s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.load{padding:40px;text-align:center;color:var(--m)}
.back{position:fixed;top:14px;left:14px;z-index:80;width:40px;height:40px;border-radius:50%;background:#000b;border:0;color:#fff;font-size:19px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">NOVA<span>FLIX</span></div>
  <nav>
    <a onclick="goHome()">Home</a>
    <a onclick="browse('movie')">Movies</a>
    <a onclick="browse('series')">Web Series</a>
    <a onclick="showList()">My List</a>
  </nav>
  <div class="srch">
    <span>&#128269;</span>
    <input id="q" placeholder="Search movies, web series..." autocomplete="off">
  </div>
</header>

<main id="app">
  <section id="hero"></section>
  <div id="rows"></div>
  <div id="sentinel"></div>
</main>

<div id="detail" class="hidden"></div>

<div id="player" class="hidden">
  <div class="pbar">
    <button class="pb" onclick="closePlayer()">&#10005;</button>
    <div class="pt" id="pTitle"></div>
    <div class="rel">
      <button class="pb" id="pAudioBtn" onclick="toggleMenu('mAudio')">&#128266; <span id="pAudioTxt">Hindi</span> &#9662;</button>
      <div class="menu hidden" id="mAudio"></div>
    </div>
    <div class="rel">
      <button class="pb" onclick="toggleMenu('mQual')">&#9881; <span id="pQualTxt">Auto</span> &#9662;</button>
      <div class="menu hidden" id="mQual"></div>
    </div>
    <div class="rel">
      <button class="pb" onclick="toggleMenu('mSub')">&#128172; <span id="pSubTxt">Subtitles</span> &#9662;</button>
      <div class="menu hidden" id="mSub"></div>
    </div>
    <div class="rel">
      <button class="pb" id="pSrvBtn" onclick="toggleMenu('mSrv')">Server &#9662;</button>
      <div class="menu hidden" id="mSrv"></div>
    </div>
    <button class="pb" onclick="nextServer()">Next Server</button>
    <button class="pb" onclick="openTab()">New Tab</button>
  </div>
  <div class="fwrap"><iframe id="frame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe></div>
  <div class="tip">Audio still English? Tap the &#128266; icon in the player and pick Hindi, or hit <b>New Tab</b>. Server: <b id="pSrvName">-</b></div>
</div>

<div id="toast"></div>

<script>
var $=function(s){return document.querySelector(s)};
var API='https://v3-cinemeta.strem.io';
var AUDIO=[['original','Original'],['hi','Hindi'],['en','English'],['ta','Tamil'],['te','Telugu'],['ml','Malayalam'],['kn','Kannada'],['bn','Bengali'],['mr','Marathi'],['pa','Punjabi'],['gu','Gujarati'],['ur','Urdu']];
var QUAL=[['','Auto'],['2160','4K'],['1080','1080p'],['720','720p'],['480','480p']];

var state={type:'movie',audio:localStorage.getItem('nfx_audio')||'hi',q:'',sub:'',srv:0,tries:0,
  imdb:null,tmdb:null,title:null,season:1,ep:1,open:false,gen:null,skip:0,search:''};

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2600)}
function lbl(c){for(var i=0;i<AUDIO.length;i++)if(AUDIO[i][0]===c)return AUDIO[i][1];return 'Original'}
function qlbl(c){for(var i=0;i<QUAL.length;i++)if(QUAL[i][0]===c)return QUAL[i][1];return 'Auto'}
function J(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}

/* ---------- servers ---------- */
var SERVERS=[
 {n:'Videasy',lang:1,q:1,tmdb:1,u:function(id,t,s,e,q,l){return 'https://player.videasy.net/'+t+'/'+id+(t==='tv'?'/'+s+'/'+e:'')+'?color=e50914'+(l?'&lang='+l:'')+(q?'&quality='+q:'')}},
 {n:'VidFast',lang:1,q:1,tmdb:1,u:function(id,t,s,e,q,l){return 'https://vidfast.pro/'+t+'/'+id+(t==='tv'?'/'+s+'/'+e:'')+'?'+(l?'lang='+l+'&':'')+(q?'quality='+q:'')}},
 {n:'VidLink',lang:1,q:1,tmdb:1,u:function(id,t,s,e,q,l){return 'https://vidlink.pro/'+t+'/'+id+(t==='tv'?'/'+s+'/'+e:'')+'?'+(l?'lang='+l+'&':'')+(q?'quality='+q:'')}},
 {n:'VidSrc.to',tmdb:0,u:function(id,t){return 'https://vidsrc.to/embed/'+t+'/'+id+'?ds_lang='+(state.audio==='original'?'en':state.audio)}},
 {n:'VidSrc.xyz',tmdb:0,u:function(id,t){return 'https://vidsrc.xyz/embed/'+t+'/'+id+'?ds_lang='+(state.audio==='original'?'en':state.audio)}},
 {n:'2Embed',tmdb:0,u:function(id){return 'https://www.2embed.cc/embed/'+id}},
 {n:'SuperEmbed',tmdb:0,u:function(id,t){return 'https://multiembed.mov/?video_id='+id+'&tmdb=0'+(t==='tv'?'&s='+state.season+'&e='+state.ep:'')}}
];

function order(){
  var l=[],i;
  for(i=0;i<SERVERS.length;i++)if(SERVERS[i].tmdb?!!state.tmdb:true)l.push(i);
  if(state.audio!=='original'){
    var L=[],O=[];
    for(i=0;i<l.length;i++)(SERVERS[l[i]].lang?L:O).push(l[i]);
    l=L.concat(O);
  }
  return l;
}

/* ---------- catalog ---------- */
function catURL(type,cat,genre,skip,search){
  var seg=[];
  if(genre)seg.push('genre='+encodeURIComponent(genre));
  if(skip)seg.push('skip='+skip);
  if(search)seg.push('search='+encodeURIComponent(search));
  return API+'/catalog/'+type+'/'+cat+(seg.length?'/'+seg.join('&'):'')+'.json';
}

var ROWS=[
 {t:'Trending Movies',type:'movie',cat:'top'},
 {t:'Trending Web Series',type:'series',cat:'top'},
 {t:'Action',type:'movie',cat:'top',g:'Action'},
 {t:'Comedy',type:'movie',cat:'top',g:'Comedy'},
 {t:'Drama Series',type:'series',cat:'top',g:'Drama'},
 {t:'Sci-Fi',type:'movie',cat:'top',g:'Sci-Fi'},
 {t:'Horror',type:'movie',cat:'top',g:'Horror'},
 {t:'Romance',type:'movie',cat:'top',g:'Romance'},
 {t:'Thriller Series',type:'series',cat:'top',g:'Thriller'},
 {t:'Animation',type:'movie',cat:'top',g:'Animation'},
 {t:'Crime Series',type:'series',cat:'top',g:'Crime'},
 {t:'Documentary',type:'movie',cat:'top',g:'Documentary'}
];

function cardHTML(it,type){
  var p=it.poster||('https://images.metahub.space/poster/medium/'+it.id+'/img');
  return '<div class="card" data-id="'+it.id+'" data-type="'+(it.type||type)+'">'+
    '<img loading="lazy" src="'+p+'" onerror="this.style.background=\'linear-gradient(160deg,#26263a,#12121a)\';this.removeAttribute(\'src\')">'+
    '<span class="cn">'+(it.name||'')+'</span></div>';
}
function bindCards(root){
  var cs=root.querySelectorAll('.card');
  for(var i=0;i<cs.length;i++)(function(c){c.onclick=function(){openDetail(c.dataset.id,c.dataset.type)}})(cs[i]);
}

function buildRows(){
  var rowsEl=$('#rows');rowsEl.innerHTML='';
  var chain=Promise.resolve();
  ROWS.forEach(function(r){
    chain=chain.then(function(){
      return J(catURL(r.type,r.cat,r.g,0,'')).then(function(d){
        if(!d.metas||!d.metas.length)return;
        var div=document.createElement('div');div.className='row';
        div.innerHTML='<h2>'+r.t+' <b>See all &rsaquo;</b></h2><div class="track">'+d.metas.slice(0,18).map(function(m){return cardHTML(m,r.type)}).join('')+'</div>';
        div.querySelector('b').onclick=function(){browse(r.type,r.g)};
        rowsEl.appendChild(div);
        bindCards(div);
      }).catch(function(){});
    });
  });
  chain.then(heroPick);
}

function heroPick(){
  J(catURL('movie','top',null,0,'')).then(function(d){
    var p=(d.metas||[]).slice(0,8);
    if(!p.length)return;
    var m=p[Math.floor(Math.random()*p.length)];
    var bg=m.background||('https://images.metahub.space/background/medium/'+m.id+'/img');
    $('#hero').style.backgroundImage='url('+bg+')';
    $('#hero').innerHTML='<div class="hero-in"><h1>'+m.name+'</h1>'+
      '<div class="meta">'+(m.releaseInfo?'<span>'+m.releaseInfo+'</span>':'')+(m.imdbRating?'<span class="rate">&#9733; '+m.imdbRating+'</span>':'')+'<span>HD</span></div>'+
      '<p>'+(m.description||'')+'</p>'+
      '<button class="btn" onclick="openDetail(\''+m.id+'\',\'movie\')">&#9654; Play</button> '+
      '<button class="btn ghost" onclick="openDetail(\''+m.id+'\',\'movie\')">More Info</button></div>';
  }).catch(function(){});
}

function goHome(){
  state.search='';$('#q').value='';
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#hero').classList.remove('hidden');
  buildRows();window.scrollTo(0,0);
}

function browse(type,g){
  state.type=type;state.gen=g||null;state.skip=0;state.search='';
  $('#hero').style.backgroundImage='';$('#hero').innerHTML='';$('#hero').classList.add('hidden');
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#rows').innerHTML='<div class="row"><h2>'+(g?g+' - ':'')+(type==='movie'?'Movies':'Web Series')+'</h2><div class="grid" id="gGrid"></div></div>';
  more();window.scrollTo(0,0);
}

function more(){
  var g=$('#gGrid');if(!g)return;
  J(catURL(state.type,'top',state.gen,state.skip,state.search)).then(function(d){
    if(!d.metas||!d.metas.length)return;
    var frag=document.createElement('div');
    frag.innerHTML=d.metas.map(function(m){return cardHTML(m,state.type)}).join('');
    while(frag.firstChild)g.appendChild(frag.firstChild);
    bindCards(g);
    state.skip+=d.metas.length;
  }).catch(function(){});
}

var sT;
$('#q').oninput=function(e){
  clearTimeout(sT);
  var v=e.target.value.trim();
  sT=setTimeout(function(){v?doSearch(v):goHome()},420);
};

function doSearch(v){
  state.search=v;
  $('#hero').classList.add('hidden');$('#hero').innerHTML='';
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#rows').innerHTML='<div class="row"><h2>Results for "'+v+'"</h2><div class="grid" id="gGrid"></div></div>';
  Promise.all([J(catURL('movie','top',null,0,v)).catch(function(){return{}}),J(catURL('series','top',null,0,v)).catch(function(){return{}})]).then(function(r){
    var all=(r[0].metas||[]).concat(r[1].metas||[]);
    var g=$('#gGrid');if(!g)return;
    if(!all.length){g.innerHTML='<div class="load">No results found</div>';return}
    var frag=document.createElement('div');
    frag.innerHTML=all.map(function(m){return cardHTML(m,m.type)}).join('');
    while(frag.firstChild)g.appendChild(frag.firstChild);
    bindCards(g);
  });
}

/* ---------- detail ---------- */
function openDetail(id,type){
  J(API+'/meta/'+type+'/'+id+'.json').then(function(d){
    var m=d.meta;if(!m)throw 0;
    state.imdb=id;state.type=type;state.title=m.name;
    state.tmdb=m.moviedb_id||m.tmdb_id||null;
    state.season=1;state.ep=1;

    $('#app').classList.add('hidden');
    var det=$('#detail');det.classList.remove('hidden');
    var bg=m.background||('https://images.metahub.space/background/medium/'+id+'/img');
    var eps='';
    state._vids=null;

    if(type==='series'&&m.videos&&m.videos.length){
      var seasons=[],i;
      for(i=0;i<m.videos.length;i++)if(m.videos[i].season>0&&seasons.indexOf(m.videos[i].season)<0)seasons.push(m.videos[i].season);
      seasons.sort(function(a,b){return a-b});
      eps='<div class="stabs">'+seasons.map(function(s){return '<div class="chip'+(s===1?' on':'')+'" data-s="'+s+'">Season '+s+'</div>'}).join('')+'</div><div id="eps"></div>';
      state._vids=m.videos;
    }

    det.innerHTML='<button class="back" onclick="closeDetail()">&#8592;</button>'+
      '<div class="dback" style="background-image:url('+bg+')"></div>'+
      '<div class="dwrap"><h1>'+(m.name||'')+'</h1>'+
      '<div class="meta">'+(m.releaseInfo?'<span>'+m.releaseInfo+'</span>':'')+(m.runtime?'<span>'+m.runtime+'</span>':'')+(m.imdbRating?'<span class="rate">&#9733; '+m.imdbRating+'</span>':'')+'</div>'+
      '<div class="chips">'+(m.genres||[]).map(function(g){return '<span class="chip">'+g+'</span>'}).join('')+'</div>'+
      '<p class="desc">'+(m.description||'')+'</p>'+
      '<div class="lbl">Audio</div><div class="chips" id="aChips"></div>'+
      '<div class="lbl">Quality</div><div class="chips" id="qChips"></div>'+
      '<div style="margin:22px 0;display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn red" id="playBtn">&#9654; Play</button>'+
        '<button class="btn ghost" id="listBtn">+ My List</button>'+
      '</div>'+eps+'</div>';

    renderAudioChips();renderQualChips();
    $('#playBtn').onclick=function(){play()};
    $('#listBtn').onclick=function(){toggleList(id,m.name,m.poster,type)};

    if(state._vids){
      var tabs=det.querySelectorAll('.stabs .chip');
      for(i=0;i<tabs.length;i++)(function(t){
        t.onclick=function(){
          for(var k=0;k<tabs.length;k++)tabs[k].classList.remove('on');
          t.classList.add('on');renderEps(parseInt(t.dataset.s,10));
        };
      })(tabs[i]);
      renderEps(1);
    }
    window.scrollTo(0,0);
  }).catch(function(){toast('Details not available')});
}

function renderAudioChips(){
  var c=$('#aChips');if(!c)return;
  c.innerHTML=AUDIO.map(function(a){return '<div class="chip'+(state.audio===a[0]?' on':'')+'" data-a="'+a[0]+'">'+a[1]+'</div>'}).join('');
  var cs=c.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++)(function(x){x.onclick=function(){audioSet(x.dataset.a);renderAudioChips()}})(cs[i]);
}
function renderQualChips(){
  var c=$('#qChips');if(!c)return;
  c.innerHTML=QUAL.map(function(a){return '<div class="chip'+(state.q===a[0]?' on':'')+'" data-q="'+a[0]+'">'+a[1]+'</div>'}).join('');
  var cs=c.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++)(function(x){x.onclick=function(){state.q=x.dataset.q;renderQualChips();if(state.open)loadFrame()}})(cs[i]);
}

function renderEps(s){
  var box=$('#eps');if(!box)return;
  var list=state._vids.filter(function(v){return v.season===s}).sort(function(a,b){return a.number-b.number});
  box.innerHTML=list.map(function(v){
    return '<div class="ep" data-e="'+v.number+'">'+
    '<img loading="lazy" src="'+(v.thumbnail||('https://images.metahub.space/background/medium/'+state.imdb+'/img'))+'" onerror="this.style.background=\'#22222e\'">'+
    '<div><div class="en">'+v.number+'. '+(v.name||('Episode '+v.number))+'</div><div class="eo">'+(v.overview||'')+'</div></div></div>';
  }).join('');
  var es=box.querySelectorAll('.ep');
  for(var i=0;i<es.length;i++)(function(e){e.onclick=function(){state.season=s;state.ep=parseInt(e.dataset.e,10);play()}})(es[i]);
}

function closeDetail(){$('#detail').classList.add('hidden');$('#app').classList.remove('hidden');goHome()}

/* ---------- list ---------- */
function getList(){try{return JSON.parse(localStorage.getItem('nfx_list')||'[]')}catch(e){return[]}}
function toggleList(id,name,poster,type){
  var l=getList(),i=-1;
  for(var k=0;k<l.length;k++)if(l[k].id===id)i=k;
  if(i>-1){l.splice(i,1);toast('Removed from My List')}
  else{l.push({id:id,name:name,poster:poster,type:type});toast('Added to My List')}
  localStorage.setItem('nfx_list',JSON.stringify(l));
}
function showList(){
  var l=getList();
  $('#hero').classList.add('hidden');$('#hero').innerHTML='';
  $('#detail').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#rows').innerHTML='<div class="row"><h2>My List</h2><div class="grid" id="gGrid">'+
    (l.length?l.map(function(m){return cardHTML(m,m.type)}).join(''):'<div class="load">Empty</div>')+'</div></div>';
  bindCards($('#rows'));
}

/* ---------- player ---------- */
function audioSet(code){
  state.audio=code;localStorage.setItem('nfx_audio',code);
  syncAudio();
  if(state.open)reloadSmart();
}
function syncAudio(){
  var t=$('#pAudioTxt');if(t)t.textContent=lbl(state.audio);
  var b=$('#pAudioBtn');if(b)b.classList.toggle('act',state.audio!=='original');
  var m=$('#mAudio');
  if(m){var ds=m.querySelectorAll('div');for(var i=0;i<ds.length;i++)ds[i].classList.toggle('on',ds[i].dataset.a===state.audio)}
}

function buildMenus(){
  var a=$('#mAudio');
  a.innerHTML=AUDIO.map(function(x){return '<div data-a="'+x[0]+'" class="'+(state.audio===x[0]?'on':'')+'">'+x[1]+'</div>'}).join('');
  var ds=a.querySelectorAll('div');
  for(var i=0;i<ds.length;i++)(function(d){d.onclick=function(){audioSet(d.dataset.a);hideMenus()}})(ds[i]);

  var q=$('#mQual');
  q.innerHTML=QUAL.map(function(x){return '<div data-q="'+x[0]+'" class="'+(state.q===x[0]?'on':'')+'">'+x[1]+'</div>'}).join('');
  var qs=q.querySelectorAll('div');
  for(var j=0;j<qs.length;j++)(function(d){d.onclick=function(){state.q=d.dataset.q;$('#pQualTxt').textContent=qlbl(state.q);loadFrame();hideMenus()}})(qs[j]);

  var s=$('#mSub');
  s.innerHTML='<div data-s="" class="'+(state.sub===''?'on':'')+'">Off</div>'+AUDIO.filter(function(x){return x[0]!=='original'}).map(function(x){return '<div data-s="'+x[0]+'" class="'+(state.sub===x[0]?'on':'')+'">'+x[1]+'</div>'}).join('');
  var ss=s.querySelectorAll('div');
  for(var k=0;k<ss.length;k++)(function(d){d.onclick=function(){
    state.sub=d.dataset.s;$('#pSubTxt').textContent=state.sub?lbl(state.sub):'Subtitles';
    var all=s.querySelectorAll('div');for(var z=0;z<all.length;z++)all[z].classList.toggle('on',all[z].dataset.s===state.sub);
    loadFrame();hideMenus();
  }})(ss[k]);

  var v=$('#mSrv');
  v.innerHTML=order().map(function(idx){return '<div data-i="'+idx+'" class="'+(idx===state.srv?'on':'')+'">'+SERVERS[idx].n+'</div>'}).join('');
  var vs=v.querySelectorAll('div');
  for(var n=0;n<vs.length;n++)(function(d){d.onclick=function(){state.srv=parseInt(d.dataset.i,10);state.tries=0;loadFrame();hideMenus()}})(vs[n]);
}

function toggleMenu(id){
  var m=$('#'+id);var wasOpen=!m.classList.contains('hidden');
  hideMenus();if(!wasOpen)m.classList.remove('hidden');
}
function hideMenus(){var ms=document.querySelectorAll('.menu');for(var i=0;i<ms.length;i++)ms[i].classList.add('hidden')}

function play(){
  var o=order();
  if(!o.length){toast('No server available');return}
  state.srv=o[0];state.tries=0;state.open=true;
  $('#player').classList.remove('hidden');
  $('#pTitle').textContent=state.title+(state.type==='series'?' - S'+state.season+'E'+state.ep:'');
  buildMenus();syncAudio();$('#pQualTxt').textContent=qlbl(state.q);
  $('#pSubTxt').textContent=state.sub?lbl(state.sub):'Subtitles';
  loadFrame();
}

function loadFrame(){
  var s=SERVERS[state.srv];if(!s)return;
  var l=state.audio==='original'?'':state.audio;
  var id=s.tmdb?state.tmdb:state.imdb;
  if(!id){nextServer();return}
  var url=s.u(id,state.type==='series'?'tv':'movie',state.season,state.ep,s.q?state.q:'',l);
  if(state.sub&&s.lang)url+='&sub_lang='+state.sub;
  $('#pSrvName').textContent=s.n;
  $('#pSrvBtn').classList.toggle('act',!!(s.lang&&state.audio!=='original'));
  $('#frame').src=url;
  clearTimeout(state._to);
  state._to=setTimeout(function(){if(state.tries<3){state.tries++;nextServer()}},9000);
}

function reloadSmart(){
  var s=SERVERS[state.srv];
  if(state.audio!=='original'&&!s.lang){
    var o=order();if(o.length)state.srv=o[0];
  }
  state.tries=0;loadFrame();
}

function nextServer(){
  var o=order(),pos=-1;
  for(var i=0;i<o.length;i++)if(o[i]===state.srv)pos=i;
  if(pos<0||pos+1>=o.length){toast('No more servers');return}
  state.srv=o[pos+1];loadFrame();
}

function openTab(){
  var s=SERVERS[state.srv];if(!s)return;
  var l=state.audio==='original'?'':state.audio;
  var id=s.tmdb?state.tmdb:state.imdb;
  window.open(s.u(id,state.type==='series'?'tv':'movie',state.season,state.ep,s.q?state.q:'',l),'_blank');
}

function closePlayer(){
  state.open=false;clearTimeout(state._to);
  $('#frame').src='about:blank';
  $('#player').classList.add('hidden');
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.open)closePlayer()});
document.addEventListener('click',function(e){if(!e.target.closest('.rel'))hideMenus()});

new IntersectionObserver(function(es){
  if(es[0].isIntersecting&&$('#gGrid')&&state.search!=='')more();
},{rootMargin:'300px'}).observe($('#sentinel'));

buildRows();
</script>
</body>
</html>
